# Scraper pour la Foire au Jambon de Bayonne
# Source officielle: https://www.foireaujambon.fr/programme-foire-au-jambon-bayonne/

id: foire-jambon
cityId: bayonne

url: "https://www.foireaujambon.fr/programme-foire-au-jambon-bayonne/"
engine: cheerio

# ⚠️  Les sélecteurs ci-dessous sont indicatifs — à vérifier contre le HTML réel avec:
#     curl -s "https://www.foireaujambon.fr/..." | grep -o 'class="[^"]*"' | sort -u
#
# Structure probable: sections par jour avec liste d'événements imbriqués.
selectors:
  dayBlock: ".programme-day, .day-section, section.day, .wp-block-group"
  dayTitle: "h2, h3, .day-title, .programme-date"
  eventItem: ".event-item, li.event, .programme-item, .wp-block-group > div"
  eventTime: ".event-time, .horaire, time, .time"
  eventLocation: ".event-location, .lieu, .place, .location"
  eventTitle: ".event-title, h4, h5, p strong, .title"
  eventNote: ".event-note, .description, .details, p:not(:first-child)"
  eventPrice: ".event-price, .tarif, .prix, .price"

dateFormat: "dddd D MMMM YYYY"
locale: fr

# Lieux pré-définis avec coords exactes (aucun appel Nominatim requis)
