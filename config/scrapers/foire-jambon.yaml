  "Rue Pelletier":
    lat: 43.488923
    lng: -1.472932
    address: "Rue Pelletier, Bayonne, France"

# Normalise les variantes de noms avant lookup dans knownLocations
locationAliases:
  "Esplanade Roland Barthes": "Esplanade Roland-Barthes"
  "Esplanade Roland Barthes (terrasse)": "Esplanade Roland-Barthes"
  "Esplanade Roland-Barthes (terrasse)": "Esplanade Roland-Barthes"
